<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personality Quiz</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    /* ===== ANIMATED BACKGROUND ===== */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(-45deg, #667eea, #764ba2, #6a11cb, #2575fc);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== MAIN CARD ===== */
    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      color: #ffffff;
    }

    h1 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 28px;
    }

    /* ===== PROGRESS BAR ===== */
    .progress-container {
      width: 100%;
      background: rgba(255,255,255,0.25);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 10px;
      width: 0%;
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      transition: width 0.4s ease;
    }

    /* ===== QUESTIONS ===== */
    .question {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
    }

    .answers button {
      width: 100%;
      margin-bottom: 12px;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: rgba(255,255,255,0.85);
      color: #222;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .answers button:hover {
      transform: scale(1.03);
      background: #ffffff;
    }

    /* ===== RESULT ===== */
    #result {
      display: none;
      text-align: center;
    }

    .result-title {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .result-text {
      font-size: 17px;
      margin-bottom: 25px;
      opacity: 0.95;
    }

    .share-btn, .restart {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .share-btn {
      background: linear-gradient(90deg, #00f2fe, #4facfe);
      color: #000;
    }

    .restart {
      background: rgba(255,255,255,0.85);
      color: #222;
    }

    .share-btn:hover, .restart:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>What’s Your Personality?</h1>

  <div class="progress-container">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div id="quiz">
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
  </div>

  <div id="result">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-text" id="resultText"></div>
    <button class="share-btn" onclick="shareResult()">Share Your Result</button>
    <button class="restart" onclick="restartQuiz()">Take Again</button>
  </div>
</div>

<script>
  const questions = [
    {
      text: "When faced with a tough decision, you usually…",
      answers: [
        { text: "Analyze all possible outcomes", type: "thinker" },
        { text: "Act quickly and confidently", type: "goGetter" },
        { text: "Talk it through with someone", type: "connector" },
        { text: "Choose what feels peaceful", type: "harmonizer" }
      ]
    },
    {
      text: "Your ideal weekend looks like…",
      answers: [
        { text: "Learning or planning ahead", type: "thinker" },
        { text: "Doing something exciting", type: "goGetter" },
        { text: "Spending time with people", type: "connector" },
        { text: "Relaxing quietly", type: "harmonizer" }
      ]
    },
    {
      text: "In a group project, you are usually the…",
      answers: [
        { text: "Strategist", type: "thinker" },
        { text: "Leader", type: "goGetter" },
        { text: "Communicator", type: "connector" },
        { text: "Mediator", type: "harmonizer" }
      ]
    },
    {
      text: "When someone disagrees with you, you tend to…",
      answers: [
        { text: "Ask for their reasoning", type: "thinker" },
        { text: "Defend your position", type: "goGetter" },
        { text: "Understand their view", type: "connector" },
        { text: "Avoid conflict", type: "harmonizer" }
      ]
    },
    {
      text: "What motivates you the most?",
      answers: [
        { text: "Understanding", type: "thinker" },
        { text: "Winning and achieving", type: "goGetter" },
        { text: "Feeling connected", type: "connector" },
        { text: "Inner peace", type: "harmonizer" }
      ]
    },
    {
      text: "Your biggest strength is…",
      answers: [
        { text: "Clear thinking", type: "thinker" },
        { text: "Bold action", type: "goGetter" },
        { text: "Empathy", type: "connector" },
        { text: "Patience", type: "harmonizer" }
      ]
    },
    {
      text: "When plans suddenly change, you feel…",
      answers: [
        { text: "Annoyed but adaptable", type: "thinker" },
        { text: "Excited", type: "goGetter" },
        { text: "Concerned for others", type: "connector" },
        { text: "Stressed", type: "harmonizer" }
      ]
    },
    {
      text: "People often describe you as…",
      answers: [
        { text: "Thoughtful", type: "thinker" },
        { text: "Driven", type: "goGetter" },
        { text: "Friendly", type: "connector" },
        { text: "Calm", type: "harmonizer" }
      ]
    },
    {
      text: "You feel most satisfied when you…",
      answers: [
        { text: "Solve a problem", type: "thinker" },
        { text: "See results", type: "goGetter" },
        { text: "Help someone", type: "connector" },
        { text: "Feel balanced", type: "harmonizer" }
      ]
    },
    {
      text: "You value more…",
      answers: [
        { text: "Logic", type: "thinker" },
        { text: "Courage", type: "goGetter" },
        { text: "Connection", type: "connector" },
        { text: "Harmony", type: "harmonizer" }
      ]
    }
  ];

  let currentQuestion = 0;
  let scores = {
    thinker: 0,
    goGetter: 0,
    connector: 0,
    harmonizer: 0
  };

  const questionEl = document.getElementById("question");
  const answersEl = document.getElementById("answers");
  const progressBar = document.getElementById("progressBar");


 function showQuestion() {
  const q = questions[currentQuestion];
  questionEl.textContent = q.text;
  answersEl.innerHTML = "";

  // 👉 UPDATE PROGRESS BAR HERE
  const progressPercent = (currentQuestion / questions.length) * 100;
  progressBar.style.width = progressPercent + "%";

  q.answers.forEach(answer => {
    const btn = document.createElement("button");
    btn.textContent = answer.text;
    btn.onclick = () => selectAnswer(answer.type);
    answersEl.appendChild(btn);
  });

  window.scrollTo({ top: 0, behavior: "smooth" });
}


  function selectAnswer(type) {
    scores[type]++;
    currentQuestion++;

    if (currentQuestion < questions.length) {
      showQuestion();
    } else {
      showResult();
    }
  }

  function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";
    progressBar.style.width = "100%";


    const resultType = Object.keys(scores).reduce((a, b) =>
      scores[a] > scores[b] ? a : b
    );

    const results = {
      thinker: {
        title: "🧠 The Thinker",
        text: "You are logical, analytical, and thoughtful. You value understanding and clarity before making decisions."
      },
      goGetter: {
        title: "🔥 The Go-Getter",
        text: "You are bold, driven, and action-oriented. You thrive on challenges and taking initiative."
      },
      connector: {
        title: "💬 The Connector",
        text: "You are empathetic, social, and expressive. Relationships and emotional connection matter deeply to you."
      },
      harmonizer: {
        title: "🌱 The Harmonizer",
        text: "You value peace, balance, and emotional well-being. You seek calm and avoid unnecessary conflict."
      }
    };

    document.getElementById("resultTitle").textContent = results[resultType].title;
    document.getElementById("resultText").textContent = results[resultType].text;
  }

  function restartQuiz() {
    currentQuestion = 0;
    scores = { thinker: 0, goGetter: 0, connector: 0, harmonizer: 0 };
    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";
    progressBar.style.width = "0%";

    showQuestion();
  }

  showQuestion();
</script>

</body>
</html>
